<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Fallbacks for crawlers that do not run scripts; js/render.js
         overwrites both from data/content.js. -->
    <title>Siddharth Singh | Portfolio</title>
    <meta name="description"
        content="Portfolio of Siddharth Singh, a software engineer working in Java, Python and Spring.">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css"
        integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a"
        crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
</head>

<body>
    <!-- Shown only if data/content.js fails to load or parse. -->
    <div id="render-error" class="alert alert-warning m-3" role="alert" hidden>
        Content failed to load. Please refresh, or reach me on
        <a href="https://www.linkedin.com/in/siddharth0801/">LinkedIn</a>.
    </div>

    <!--Nav Bar-->
    <nav class="navbar navbar-expand-lg fixed-top">
        <a class="navbar-brand" id="nav-brand" href=".">sid.</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto" id="nav-links"></ul>
        </div>
    </nav>
    <!--Nav Bar End-->

    <header id="home" class="site-header">
        <div class="container-fluid" style="background-color:transparent;">
            <div class="row">
                <div class="col-lg-7">
                    <div class="hero" id="hero"></div>
                </div>
            </div>
        </div>
    </header>

    <noscript>
        <div class="container my-5">
            <h1>Siddharth Singh</h1>
            <p>Software Engineer, Explorer, Chess Player. This site needs JavaScript
                for the full experience.</p>
            <p>
                <a href="https://www.linkedin.com/in/siddharth0801/">LinkedIn</a> &middot;
                <a href="https://github.com/siddharth0801">GitHub</a>
            </p>
        </div>
    </noscript>

    <!--About Me-->
    <div id="about" class="container aboutme">
        <div class="row head text-center">
            <div class="col-lg-12">
                <h1 class="section-heading">About</h1>
            </div>
        </div>
        <div class="body row">
            <div class="col-lg-6" id="about-bio"></div>
            <div class="col-lg-6 text-start" style="padding-top:50px;">
                <ul class="education list-unstyled" id="education-list"></ul>
            </div>
        </div>
    </div>

    <!--Skills-->
    <section id="skills">
        <div class="container skill">
            <div class="row text-center skillhead">
                <div class="col-lg-12">
                    <h1 class="section-heading">My Skills</h1>
                </div>
            </div>
        </div>
    </section>
    <div class="container">
        <ul class="skill-grid" id="skills-grid"></ul>
    </div>

    <!--Projects-->
    <section class="projects" id="prj">
        <div class="container-fluid">
            <div class="text-center myprojects">
                <h1 class="section-heading">My Projects</h1>
            </div>
        </div>
        <div class="container">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4 justify-content-center"
                id="projects-grid"></div>
        </div>
    </section>

    <!--Contact-->
    <div class="modal fade" id="contact-modal" tabindex="-1"
        aria-labelledby="contact-modal-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered contact-modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="contact-modal-title">Get in Touch</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body" id="contact-form-mount"></div>
            </div>
        </div>
    </div>

    <!--Footer-->
    <footer class="site-footer" id="contact">
        <div class="container">
            <div class="row text-center sitefooterhead">
                <div class="col-lg-12">
                    <h1><b>Follow Me</b></h1>
                </div>
            </div>
            <div class="row text-center sitefooterbody">
                <div class="col-lg-12" id="footer-socials"></div>
                <div class="col-lg-12" id="footer-copyright"></div>
            </div>
        </div>
    </footer>

    <!--Scripts-->
    <!-- defer preserves document order, so PORTFOLIO and `bootstrap` are both
         defined before main.js runs, and every script runs after the DOM is
         parsed. No DOMContentLoaded wrapper needed. -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script defer src="data/content.js"></script>
    <script defer src="js/render.js"></script>
    <script defer src="js/typewriter.js"></script>
    <script defer src="js/contact.js"></script>
    <script defer src="js/main.js"></script>
</body>

</html>
